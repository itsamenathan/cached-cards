<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/icon-32.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color" content="#0b0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cached Cards" />
    <script>
      // Resolve the theme before first paint. Without this the prerendered
      // markup is always dark and users on any other theme get a flash on
      // every load. The colour map below is substituted from src/themes.js by
      // the theme bootstrap plugin in vite.config.js; if that ever fails the
      // reference throws and we fall back to dark rather than to a broken page.
      ;(function () {
        try {
          var colors = __THEME_COLORS__
          var stored = localStorage.getItem('cached-cards-theme')
          var theme = colors[stored]
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document
            .getElementById('theme-color')
            .setAttribute('content', colors[theme])
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <meta
      name="description"
      content="Cached Cards is an offline-first library for card game rules."
    />
    <meta property="og:title" content="Cached Cards" />
    <meta
      property="og:description"
      content="Offline-first library of card game rules. Works without Wi-Fi."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cachedcards.com/" />
    <meta property="og:image" content="https://cachedcards.com/icons/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cached Cards",
        "url": "https://cachedcards.com/",
        "description": "Offline-first library of card game rules."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Cached Cards",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "url": "https://cachedcards.com/",
        "description": "Offline-first library of card game rules.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <title>Cached Cards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
